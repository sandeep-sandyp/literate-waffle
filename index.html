<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A curated list of starred software repositories.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Starred repositories</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Software shelf</p>
        <h1>Starred repositories</h1>
        <p class="intro">A short list of tools and ideas worth keeping close.</p>
      </header>

      <section aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Your collection</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <div id="repository-list" class="repository-list" aria-live="polite">
          <p class="status">Loading repositories...</p>
        </div>
      </section>
    </main>
  </body>
</html>
